        - ""
        - "&a» Bosib o'yinchi yoniga o'ting"

    punish:
      slot: 15
      material: "NETHERITE_SWORD"
      name: "&c&l6. Quick Punish"
      lore:
        - "&7Tezkor 1-bosish bilan Ban,"
        - "&7Mute va Ogohlantirish berish."
        - ""
        - "&c» Bosib menyuni oching"

    kick:
      slot: 16
      material: "REDSTONE"
      name: "&e&l7. Kick"
      lore:
        - "&7O'yinchini serverdan chiqarib"
        - "&7yuborish."
        - ""
        - "&e» Bosib kick qiling"

    alts:
      slot: 17
      material: "SPYGLASS"
      name: "&d&l8. Check Alts / IP"
      lore:
        - "&7O'yinchining barcha boshqa"
        - "&7akkauntlarini ko'rish."
        - ""
        - "&d» Bosib tekshiring"

    remove-sus:
      slot: 18
      material: "ANVIL"
      name: "&4&l9. Remove from Sus"
      lore:
        - "&7O'yinchini shubhali ro'yxatdan"
        - "&7to'liq olib tashlash."
        - ""
        - "&4» Bosib ro'yxatdan o'chiring"

# Optional; SentinelGuard also runs without SentinelAC.
integrations:
  sentinelac:
    enabled: true
    sus-threshold: 10
