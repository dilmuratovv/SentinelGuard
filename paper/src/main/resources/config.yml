# Optional; SentinelGuard also runs without SentinelAC, SentinelAD and SentinelAX-ray.
integrations:
  sentinelad:
    enabled: true
    min-confidence: 60
    sus-threshold: 1
  # SentinelAX-ray suspicious-mining flags (statistical, so a higher confidence bar).
  sentinelaxray:
    enabled: true
    min-confidence: 70
    sus-threshold: 1
  sentinelac:
    enabled: true
    # Flags of one check inside a window that put a player on the sus list. Checks differ a lot: one KillAura or
    # Backtrack flag is strong evidence, movement checks also fire on lag. Built-in defaults:
    #   KillAura*, TrackingA, BacktrackA, AutoTotem*, CrystalAura*, AimModulo360, Baritone, FabricatedPlace,
    #   Exploit*, Crash*: 1 in 10 min | AimDuplicateLook: 2/10 min | Hitboxes, AutoClicker*: 2/5 min | Reach: 3/5 min
    #   AntiKB: 5/2 min | Chat*: 5/min | Phase, NoFall, GroundSpoof, Elytra*, Vehicle*, NoSlow: 10/min
    #   Timer*, Sprint*: 15/min | Simulation: 25/min | anything else: sus-threshold / window-seconds.
    sus-threshold: 10
    window-seconds: 60
    # Override or add rules: "<check or prefix*>": "<flags>/<seconds>"
    checks: {}
    #  Reach: "2/300"
    #  BadPackets*: "5/60"

# ------------------------------------------------------ #
# Network mode (Velocity + several Paper servers)
# MariaDB is authoritative. Every server with the same database shares bans, IP bans,
# mutes, warnings and history. Redis is optional: it only speeds up propagation and
# carries staff chat; SQL polling keeps servers correct without it.
# Freeze stays per-server: it is live state on the server the player is on.
# Changing this section requires a server restart.
# ------------------------------------------------------ #
network:
  enabled: false
  # Unique, stable name of this Paper server (used in history and legacy import ids).
  server-id: "survival"
  database:
    jdbc-url: "jdbc:mariadb://127.0.0.1:3306/sentinelguard"
    username: "sentinelguard"
    password: ""
    pool-size: 4
    # Hosts close idle database connections after 30-60 s (MariaDB wait_timeout). Each connection is probed this often
    # and replaced before max-lifetime, so "disconnected by the server because of inactivity" warnings do not appear.
    keepalive-seconds: 20
    max-lifetime-seconds: 240
  # If the database is unreachable: true = deny logins (bans are never bypassed), false = allow.
  deny-login-on-database-error: true
  database-error-login: "&cModeratsiya xizmati vaqtincha ishlamayapti. Keyinroq qayta urinib ko'ring."
  database-error-command: "&cMa'lumotlar bazasi xatosi: amal saqlanmadi. Keyinroq qayta urinib ko'ring."
  # How often committed changes from other servers are read (20 ticks = 1 second).
  poll-interval-ticks: 40
  # Days of change history kept in the sg_outbox table. Servers re-sync from the database on start,
  # so old events are not needed; keep this above the longest outage you want to ride out live.
  outbox-retention-days: 7
  # Recent punishments kept in memory at startup; history commands always read the full history.
  cache-size: 20000
  history-limit: 500
  # Copy the old punishments.yml into the database on start. Safe to repeat; the file is never changed.
  import-legacy-on-start: true
  # Which network punishments apply on THIS server (each Paper server sets its own).
  # The choice is published to the shared database, so the Velocity proxy follows it too.
  scope:
    # true  = bans and IP bans given on any server apply here (banned players cannot join).
    # false = this server ignores bans: banned players may play here (e.g. a lobby or appeal server).
    #         The proxy lets them connect to this server only and blocks the others.
    enforce-bans: true
    # true  = mutes given on any server silence the player here.
    # false = muted players may chat here.
    enforce-mutes: true
    # Tell this server's players when a ban/mute/unban/unmute happens on another server.
    # Only kinds this server enforces are announced; silent (-s) actions reach staff only.
    announce-remote: true
  staff-chat-format: "&8[&cStaffChat&8] &7[{server}] &b{staff}&8: &f{message}"
  redis:
    enabled: false
    # Put a password in the uri, e.g. redis://:password@host:6379 (Redis carries signals and staff chat only).
    uri: "redis://127.0.0.1:6379"
    channel: "sentinelguard"
