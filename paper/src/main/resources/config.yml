    material: "BARRIER"
    name: "&c« Orqaga"
    lore:
      - "&7Asosiy menyuga qaytish"
  buttons:
    add-reason:
      slot: 10
      material: "WRITABLE_BOOK"
      name: "&e&l1. Add Sus Reason"
      lore:
        - "&7O'yinchiga yangi shubha sababini"
        - "&7qo'lda chat orqali kiritish."
        - ""
        - "&a» Bosib sabab kiriting"

    history:
      slot: 11
      material: "BOOK"
      name: "&b&l2. Log / History"
      lore:
        - "&7O'yinchining barcha avvalgi jazolari"
        - "&7va shubhalar tarixini ko'rish."
        - ""
        - "&a» Bosib tarixni ko'ring"

    freeze:
      slot: 12
      material: "ICE"
      name: "&3&l3. Freeze / Unfreeze"
      lore:
        - "&7Hozirgi holat: {frozen_status}"
        - "&7Muzlaganda harakatlana olmaydi,"
        - "&7chat va buyruqlar yopiladi."
        - ""
        - "&a» Bosib holatni o'zgartiring"

    tp-here:
      slot: 13
      material: "ENDER_PEARL"
      name: "&a&l4. TP (Player to Me)"
      lore:
        - "&7O'yinchini sizning yoningizga"
        - "&7teleport qilish."
        - ""
        - "&a» Bosib teleport qiling"

    tp-to:
      slot: 14
