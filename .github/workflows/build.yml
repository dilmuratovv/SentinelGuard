name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['paper-v*', 'velocity-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  MAVEN_OPTS: -Dsun.misc.unsafe.memory.access=allow

jobs:
  paper:
    if: ${{ !startsWith(github.ref, 'refs/tags/velocity-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['1.21', '1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/set_version.py "${GITHUB_REF_NAME#*-v}"
      - run: python3 tools/check-source.py
      - run: mvn -B -pl paper -am -Ppaper-${{ matrix.target }} verify
      - run: |
          mkdir -p target/checks
          javac --release 21 -d target/checks common/src/main/java/uz/sentinel/guard/network/*.java tools/CoreChecks.java
          java -cp target/checks CoreChecks
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelGuard-paper${{ matrix.target }}
          path: paper/target/SentinelGuard-*.jar
          if-no-files-found: error

  velocity:
    if: ${{ !startsWith(github.ref, 'refs/tags/paper-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['3.5.1', '4.1.1', '4.2.0', '4.3.0', '4.3.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/set_version.py "${GITHUB_REF_NAME#*-v}"
      - run: mvn -B -pl velocity -am -Pvelocity-${{ matrix.target }} verify
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelGuard-velocity${{ matrix.target }}
          path: velocity/target/SentinelGuard-*-velocity*.jar
          if-no-files-found: error

  # MariaDB + Redis + Velocity + two Paper servers with real clients (tools/network_smoke.py).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        velocity: ['3.5.1', '4.1.1', '4.2.0', '4.3.0', '4.3.1']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sentinelguard
          MARIADB_USER: sg
          MARIADB_PASSWORD: sgtest
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/client/package-lock.json
      - name: Release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/set_version.py "${GITHUB_REF_NAME#*-v}"
      - name: Store tests on MariaDB
        env:
          SG_TEST_JDBC_URL: jdbc:mariadb://127.0.0.1:3306/sentinelguard
          SG_TEST_JDBC_USER: sg
          SG_TEST_JDBC_PASSWORD: sgtest
        run: mvn -B -pl common test
      - run: mvn -B -pl paper,velocity -am -Ppaper-1.21.11,velocity-${{ matrix.velocity }} verify
      - run: npm ci --ignore-scripts
        working-directory: tools/client
      - name: Network runtime test
        run: >-
          python3 tools/network_smoke.py --accept-eula --reset-database
          --jdbc-url jdbc:mariadb://127.0.0.1:3306/sentinelguard --db-user sg --db-password sgtest
          --redis-uri redis://127.0.0.1:6379 --target 1.21.11 --velocity-version ${{ matrix.velocity }} --java java
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-smoke-velocity${{ matrix.velocity }}
          path: |
            target/network-smoke/*.log
            target/network-smoke/report.json
          if-no-files-found: warn

  # Two separate releases: tag paper-vX.Y.Z publishes the 15 Paper JARs, tag velocity-vX.Y.Z the Velocity JAR.
  release-paper:
    if: startsWith(github.ref, 'refs/tags/paper-v')
    needs: [paper, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SentinelGuard-paper*
          path: dist
          merge-multiple: true
      - name: Verify artifact set
        run: |
          version="${GITHUB_REF_NAME#paper-v}"
          cd dist
          rm -f original-*.jar
          for target in 1.21 1.21.1 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 26.1.1 26.1.2 26.2 26.3; do
            test -f "SentinelGuard-${version}-paper${target}.jar" || { echo "missing paper${target}"; exit 1; }
          done
          test "$(ls SentinelGuard-*.jar | wc -l)" -eq 15
          sha256sum SentinelGuard-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/SentinelGuard-*.jar dist/SHA256SUMS.txt --title "SentinelGuard ${GITHUB_REF_NAME#paper-v} for Paper" --notes-file docs/RELEASE-paper.md --verify-tag

  release-velocity:
    if: startsWith(github.ref, 'refs/tags/velocity-v')
    needs: [velocity, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SentinelGuard-velocity*
          path: dist
          merge-multiple: true
      - name: Verify artifact set
        run: |
          version="${GITHUB_REF_NAME#velocity-v}"
          cd dist
          rm -f original-*.jar
          for target in 3.5.1 4.1.1 4.2.0 4.3.0 4.3.1; do
            test -f "SentinelGuard-${version}-velocity${target}.jar" || { echo "missing velocity${target}"; exit 1; }
          done
          test "$(ls SentinelGuard-*.jar | wc -l)" -eq 5
          sha256sum SentinelGuard-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/SentinelGuard-*.jar dist/SHA256SUMS.txt --title "SentinelGuard ${GITHUB_REF_NAME#velocity-v} for Velocity" --notes-file docs/RELEASE-velocity.md --verify-tag
